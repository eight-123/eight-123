<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>実音変換ツール</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    margin-top:40px;
}

select,input,button{
    font-size:20px;
    margin:8px;
}

#result{
    font-size:28px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>🎼 実音変換</h1>

<!-- 移調選択 -->
<label>楽譜：</label>
<select id="instrument">
<option value="0">in C</option>
<option value="-2">in B♭</option>
<option value="3">in E♭</option>
<option value="-5">in F</option>
</select>

<br>

<!-- 音名 -->
<label>音名：</label>
<select id="note">
<option>C>ド</option>
<option>D>レ</option>
<option>E>ミ</option>
<option>F>ファ</option>
<option>G>ソ</option>
<option>A>ラ</option>
<option>B>シ</option>
</select>

<!-- ♮♭♯ -->
<select id="accidental">
<option value="0">♮</option>
<option value="1">♯</option>
<option value="-1">♭</option>
</select>

<br>

<button onclick="convert()">変換</button>

<div id="result"></div>

<script>

const scale=[
"C","C#","D","D#","E",
"F","F#","G","G#","A","A#","B"
];

function convert(){

let shift=Number(
document.getElementById("instrument").value
);

let note=
document.getElementById("note").value;

let accidental=
Number(
document.getElementById("accidental").value
);

// 基本音の位置
let index=scale.indexOf(note);

// ♯♭反映
index+=accidental;

// 実音へ移調
let newIndex=(index+shift+12)%12;

document.getElementById("result")
.innerText="実音： "+scale[newIndex];

}

</script>

</body>
</html>
